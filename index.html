<html lang="ja">

  <div class="wrap">
    <header class="site"><a href="/">yossy-craft</a></header>

    <main>
      <h1>yossy-craft</h1>
      <p>Yossy です。仕事や家で使う Windows のちょっとした道具を、自分用に作っています。そのうち、ほかの人にも使ってもらえそうなものをここに置いています。どれも無料です。</p>

      <h2>ツール</h2>
      <ul class="tools">
        <li>
          <img src="/assets/img/screenpen/logo.png" alt="" width="44" height="44">
          <div>
            <a class="name" href="/screenpen/">ScreenPen</a><span class="ver">0.9.0</span>
            <p>画面の上にペンで書き込めるツール。画面共有やプレゼンで、指し示したいところに丸を付けたりするのに使っています。</p>
          </div>
        </li>
        <li>
          <img src="/assets/img/tablauncherx2/logo.png" alt="" width="44" height="44">
          <div>
            <a class="name" href="/tablauncherx2/">TabLauncherX2</a><span class="ver">1.3.1</span>
            <p>よく開くフォルダやサイトをボタンにしておけるランチャー。フォルダはエクスプローラーの新しいタブで開きます。</p>
          </div>
        </li>
      </ul>
    </main>

    <footer class="site">© yossy-craft</footer>
